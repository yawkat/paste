name: Update flake

on:
  workflow_dispatch:
    inputs:
      cooldown_days:
        description: >-
          Only take third-party commits at least this many days old
          (0 for an urgent update). Inputs under yawkat/ and nixpkgs are exempt.
        type: number
        default: 5
  schedule:
    # Thursday, so the PR can be merged before the flakes using this one
    # update (nixcfg-shared on Monday). Off the full hour (GitHub delays or
    # drops scheduled runs under load, and the top of the hour is the
    # busiest) and apart from the other repositories' updates.
    - cron: '37 4 * * 4'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Pinned to a commit: it runs with this job's write permissions.
      - uses: yawkat/flake-cooldown@5eca44355118307e976074ddab3c51f6f94df5dc
        id: update
        with:
          cooldown-days: ${{ inputs.cooldown_days }}
          # Stable channel: security backports should not wait out the cooldown.
          exempt-inputs: nixpkgs
      # The Maven dependency download depends on nixpkgs' Maven, so a new one can change its hash.
      - name: Update nix/deps.sha256
        run: nix/update-deps-hash.sh
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: update_flake_lock_action
          delete-branch: true
          title: flake update
          body: ${{ steps.update.outputs.body }}
