name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # started by renovate-deps.yml after it pushes the regenerated nix/deps.sha256
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

  # the packages and the NixOS VM test, built offline from the dependencies pinned by nix/deps.sha256
  nix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # hardware acceleration for the NixOS test VM
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      # Fails with a hash mismatch if nix/deps.sha256 is out of date with the pom.xml files.
      - name: Check flake
        run: nix flake check -L

